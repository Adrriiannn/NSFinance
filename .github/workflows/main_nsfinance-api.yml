name: NSFinance Production Delivery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main_nsfinance-api.yml"
      - ".config/dotnet-tools.json"
      - "apps/api/**"
      - "apps/mobile/**"
      - "libs/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tools/mobile/**"
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Run the production API migration and deployment path"
        required: true
        default: false
        type: boolean
      build_android:
        description: "Build and retain production Android APK and AAB artifacts"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: nsfinance-production-delivery
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.8.0"
  API_PROJECT_PATH: apps/api/src/NSFinance.Api/NSFinance.Api.csproj
  API_SOLUTION_PATH: apps/api/NSFinance.Api.slnx
  PUBLISH_OUTPUT_PATH: ${{ github.workspace }}/artifacts/api-publish
  DEPLOY_PACKAGE_PATH: ${{ github.workspace }}/artifacts/nsfinance-api.zip
  MIGRATION_BUNDLE_PATH: ${{ github.workspace }}/artifacts/efbundle
  AZURE_WEBAPP_NAME: nsfinance-api
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_API_RESOURCE_GROUP }}
  PRODUCTION_API_URL: https://api.finance.nsireland.ie

jobs:
  changes:
    name: Select Required Production Work
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.select.outputs.deploy_api }}
      build_android: ${{ steps.select.outputs.build_android }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_DEPLOY_API: ${{ inputs.deploy_api }}
          MANUAL_BUILD_ANDROID: ${{ inputs.build_android }}
        shell: pwsh
        run: |
          $deployApi = $false
          $buildAndroid = $false
          $changedPaths = @()

          if ($env:EVENT_NAME -eq "push") {
            $baseSha = $env:BEFORE_SHA
            if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -match "^0+$") {
              $baseSha = git rev-list --max-parents=0 HEAD | Select-Object -First 1
            }

            $changedPaths = @(git diff --name-only $baseSha $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to determine changed paths."
            }

            foreach ($path in $changedPaths) {
              $normalizedPath = $path.Replace("\", "/")

              if ($normalizedPath -match "^(apps/api/|libs/shared/|\.config/dotnet-tools\.json$)") {
                $deployApi = $true
              }

              if ($normalizedPath -match "^(apps/mobile/|tools/mobile/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)") {
                $buildAndroid = $true
              }
            }
          }
          elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            $deployApi = $env:MANUAL_DEPLOY_API -eq "true"
            $buildAndroid = $env:MANUAL_BUILD_ANDROID -eq "true"
          }
          else {
            throw "Unsupported workflow event '$($env:EVENT_NAME)'."
          }

          $deployApiValue = $deployApi.ToString().ToLowerInvariant()
          $buildAndroidValue = $buildAndroid.ToString().ToLowerInvariant()
          "deploy_api=$deployApiValue" | Add-Content $env:GITHUB_OUTPUT
          "build_android=$buildAndroidValue" | Add-Content $env:GITHUB_OUTPUT

          "## Production work selection" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- API migration and deployment: $deployApiValue" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Android APK and AAB: $buildAndroidValue" | Add-Content $env:GITHUB_STEP_SUMMARY

  deploy-api:
    name: Test, Migrate, And Deploy API
    needs: changes
    if: needs.changes.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate production inputs
        env:
          PROD_DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: pwsh
        run: |
          $requiredValues = [ordered]@{
            AZURE_API_RESOURCE_GROUP = "${{ env.AZURE_RESOURCE_GROUP }}"
            PROD_DB_CONNECTION_STRING = $env:PROD_DB_CONNECTION_STRING
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Required production setting '$($entry.Key)' is not configured."
            }
          }

      - name: Restore local .NET tools
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet tool restore failed."
          }

      - name: Restore backend dependencies
        shell: pwsh
        run: |
          dotnet restore $env:API_SOLUTION_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed for the backend solution."
          }

      - name: Run backend release gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/test-results" | Out-Null
          dotnet test $env:API_SOLUTION_PATH `
            --configuration Release `
            --no-restore `
            --logger "trx;LogFileName=backend-tests.trx" `
            --results-directory "artifacts/test-results"

          if ($LASTEXITCODE -ne 0) {
            throw "Backend tests failed. Production migration and deployment are blocked."
          }

      - name: Retain backend test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nsfinance-backend-tests-${{ github.run_number }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Publish API project
        shell: pwsh
        run: |
          Remove-Item $env:PUBLISH_OUTPUT_PATH -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:PUBLISH_OUTPUT_PATH | Out-Null

          dotnet publish $env:API_PROJECT_PATH `
            --configuration Release `
            --output $env:PUBLISH_OUTPUT_PATH `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed for the API project."
          }

      - name: Create EF Core migration bundle
        env:
          PROD_DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}
        shell: pwsh
        run: |
          Remove-Item $env:MIGRATION_BUNDLE_PATH -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path $env:MIGRATION_BUNDLE_PATH) | Out-Null

          $env:NSFINANCE_DB_CONNECTION_STRING = $env:PROD_DB_CONNECTION_STRING
          $env:ConnectionStrings__DefaultConnection = $env:PROD_DB_CONNECTION_STRING

          dotnet ef migrations bundle `
            --project $env:API_PROJECT_PATH `
            --startup-project $env:API_PROJECT_PATH `
            --configuration Release `
            --output $env:MIGRATION_BUNDLE_PATH

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $env:MIGRATION_BUNDLE_PATH)) {
            throw "EF Core migration bundle creation failed."
          }

      - name: Run EF Core migrations against production database
        env:
          PROD_DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}
        shell: pwsh
        run: |
          $env:NSFINANCE_DB_CONNECTION_STRING = $env:PROD_DB_CONNECTION_STRING
          $env:ConnectionStrings__DefaultConnection = $env:PROD_DB_CONNECTION_STRING

          chmod +x $env:MIGRATION_BUNDLE_PATH
          & $env:MIGRATION_BUNDLE_PATH --connection "$env:PROD_DB_CONNECTION_STRING"

          if ($LASTEXITCODE -ne 0) {
            throw "Production migration failed. API deployment will not continue."
          }

      - name: Archive published output
        shell: pwsh
        run: |
          Remove-Item $env:DEPLOY_PACKAGE_PATH -Force -ErrorAction SilentlyContinue
          Compress-Archive `
            -Path (Join-Path $env:PUBLISH_OUTPUT_PATH '*') `
            -DestinationPath $env:DEPLOY_PACKAGE_PATH `
            -Force

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Clean deploy API artifact
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            az webapp deploy \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --src-path "$DEPLOY_PACKAGE_PATH" \
              --type zip \
              --clean true \
              --restart true \
              --async false

      - name: Verify production API health
        shell: pwsh
        run: |
          $healthy = $false

          foreach ($attempt in 1..12) {
            try {
              $response = Invoke-RestMethod -Uri "$env:PRODUCTION_API_URL/health" -TimeoutSec 20
              if ($response.status -eq "Healthy") {
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Health attempt $attempt did not succeed yet."
            }

            Start-Sleep -Seconds 10
          }

          if (-not $healthy) {
            throw "Production API health verification failed after deployment."
          }

  build-android:
    name: Validate And Build Android APK And AAB
    needs:
      - changes
      - deploy-api
    if: >-
      ${{
        always() &&
        needs.changes.outputs.build_android == 'true' &&
        (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      }}
    runs-on: [self-hosted, windows, x64, nsfinance-android]
    environment: production
    timeout-minutes: 45
    env:
      NSFINANCE_FORCE_PERSISTENT_BUILD_WORKSPACE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify live production API
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "$env:PRODUCTION_API_URL/health" -TimeoutSec 20
          if ($response.status -ne "Healthy") {
            throw "The production API is not healthy. Android build is blocked."
          }

      - name: Validate, build, sign, and verify Android artifacts
        id: package
        shell: pwsh
        run: ./tools/mobile/Invoke-AndroidBuild.ps1 -OutputDirectory local-builds/ci -ArtifactFormat Both

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nsfinance-android-${{ steps.package.outputs.app_version }}-${{ steps.package.outputs.version_code }}-${{ github.run_number }}
          path: |
            local-builds/ci/*.apk
            local-builds/ci/*.aab
            local-builds/ci/*.manifest.json
            local-builds/ci/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write Android delivery summary
        env:
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          APK_SHA256: ${{ steps.package.outputs.apk_sha256 }}
          AAB_PATH: ${{ steps.package.outputs.aab_path }}
          AAB_SHA256: ${{ steps.package.outputs.aab_sha256 }}
        shell: pwsh
        run: |
          "## Android artifacts ready" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- APK: ``$(Split-Path $env:APK_PATH -Leaf)``" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- APK SHA-256: ``$env:APK_SHA256``" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- AAB: ``$(Split-Path $env:AAB_PATH -Leaf)``" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- AAB SHA-256: ``$env:AAB_SHA256``" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Download both from this workflow run's Artifacts section." | Add-Content $env:GITHUB_STEP_SUMMARY

  delivery-summary:
    name: Production Delivery Summary
    needs:
      - changes
      - deploy-api
      - build-android
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Record final job states
        env:
          API_REQUESTED: ${{ needs.changes.outputs.deploy_api }}
          ANDROID_REQUESTED: ${{ needs.changes.outputs.build_android }}
          API_RESULT: ${{ needs.deploy-api.result }}
          ANDROID_BUILD_RESULT: ${{ needs.build-android.result }}
        shell: pwsh
        run: |
          "## NSFinance production delivery" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- API requested: $env:API_REQUESTED; result: $env:API_RESULT" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Android requested: $env:ANDROID_REQUESTED" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Android APK and AAB: $env:ANDROID_BUILD_RESULT" | Add-Content $env:GITHUB_STEP_SUMMARY
