services:
  postgres:
    image: postgres:17
    container_name: nsfintech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nsfintech
      POSTGRES_USER: nsfintech
      POSTGRES_PASSWORD: nsfintech_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nsfintech_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsfintech -d nsfintech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nsfintech_postgres_data: